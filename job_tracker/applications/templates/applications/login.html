{% extends "applications/base.html" %}

{% block title %}Log in | JobTrack{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Log in to JobTrack</h1>
    <p class="muted">Keep your job search organized in one place.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button button-primary button-wide" type="submit">Log in</button>
    </form>
    <p class="form-footer">New here? <a href="{% url 'register' %}">Create an account</a></p>
</section>
{% endblock %}
